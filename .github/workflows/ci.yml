name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

# Least privilege: build jobs (which run third-party npm install scripts)
# only read; the release job alone gets contents: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    # Job-level `if` is evaluated before matrix expansion, so the 'only'
    # filter lives on the steps (runner spin-up for skipped jobs is seconds).
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash # pwsh/zsh would silently skip the sync scripts on some runners
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false # no token in .git/config for npm scripts

      - name: fetch gnuplot (gnuplot.lock), apply patches/, verify vendored sdk header
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-gnuplot.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils

      - name: toolchain (windows)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        shell: bash
        run: |
          if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            choco install -y mingw ninja
          fi
          command -v g++ >/dev/null 2>&1 || { echo "no mingw g++ on PATH"; exit 1; }
          g++ --version | head -1

      - name: Private pinned lmscript compiler
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/lmplot-compiler" @lmctl-ai/lmctl@0.2.460
          export LMSCRIPT_BIN="$RUNNER_TEMP/lmplot-compiler/node_modules/.bin/lmscript"
          if command -v cygpath >/dev/null 2>&1; then export LMSCRIPT_BIN="$(cygpath -m "$LMSCRIPT_BIN")"; fi
          echo "LMSCRIPT_BIN=$LMSCRIPT_BIN" >> "$GITHUB_ENV"
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no current compiler available"; exit 1; }

      - name: python3 shim (windows)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p .ci-bin
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
          chmod +x .ci-bin/python3
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        run: ./test.sh

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "build/lmplot$ext" "dist/lmplot-${{ matrix.name }}$ext"
          cp LICENSE THIRD_PARTY_NOTICES dist/
          tar czf dist/lmplot-gnuplot-patches.tar.gz gnuplot.lock patches

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmplot-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmplot-*
          path: dist
          merge-multiple: true

      - name: Read the tested release version
        id: version
        run: |
          chmod +x dist/lmplot-linux-x64
          version="$(dist/lmplot-linux-x64 --version)"
          version="${version#lmplot }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: generate binary checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -name 'lmplot-*' ! -name '*.sha256' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # Released versions are immutable; documentation-only pushes never overwrite assets.
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; retaining its qualified source and bytes"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --generate-notes dist/*
          fi
